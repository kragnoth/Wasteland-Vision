[[mods]]
modId="wastelandvision"
version="0.24.1"
displayName="Wasteland Vision"
authors="Kragnoth"
description='''
A client-side hallucination layer: the world is fine, but you see something else.
Ships with Soot & Tar: a dieselpunk smog world of soot-stained stone, creosoted timber, tar mud and falling ash.
Toggle with the Wasteland Vision key (default H); data-driven visions live in config/wastelandvision/.
'''

[[mixins]]
config="wastelandvision.mixins.json"

# Optional compat (targets other mods via @Pseudo; silently skipped when they're absent)
[[mixins]]
config="wastelandvision.compat.mixins.json"

