plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.115'
}

// Auto-increment: every build/jar/assemble bumps the patch number in gradle.properties and
// neoforge.mods.toml before configuring, so each compiled jar has a new version. Skip with -PnoBump.
def bumpTasks = ['build', 'jar', 'assemble']
if (!project.hasProperty('noBump') && gradle.startParameter.taskNames.any { t -> bumpTasks.any { t == it || t.endsWith(':' + it) } }) {
    def propsFile = file('gradle.properties')
    def m = (propsFile.text =~ /(?m)^mod_version=(\d+)\.(\d+)\.(\d+)\s*$/)
    if (m.find()) {
        def next = "${m.group(1)}.${m.group(2)}.${(m.group(3) as int) + 1}"
        propsFile.text = propsFile.text.replaceFirst(/(?m)^mod_version=.*$/, "mod_version=${next}")
        def toml = file('src/main/resources/META-INF/neoforge.mods.toml')
        toml.text = toml.text.replaceFirst(/(?m)^version=".*"$/, "version=\"${next}\"")
        project.ext.mod_version = next
        logger.lifecycle("Version bumped to ${next}")
    }
}
version = project.ext.has('mod_version') ? project.ext.mod_version : mod_version
group = mod_group_id

base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    maven {
        name = 'BlameJared (JEI)'
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'mezz.jei' }
    }
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    // Fallback: drop Jade/JEI jars into ./libs if a remote version won't resolve.
    flatDir { dirs 'libs' }
}

dependencies {
    // JEI: compile against the API, run the full mod in dev so you can test the plugin.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // Jade (published on Modrinth). Same jar for compile + dev runtime.
    compileOnly "maven.modrinth:jade:${jade_version}"
    runtimeOnly "maven.modrinth:jade:${jade_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
